<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drum Pad Machine</title>

  <!-- Bootstrap CSS via CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-light">

  <div class="container py-4">

    <header class="text-center mb-4">
      <h1 class="display-6 fw-bold">Drum Pad Machine</h1>
      <p class="text-secondary">16 sounds &middot; 16-step sequencer &middot; play live or record a pattern</p>
    </header>

    <!-- Transport Controls -->
    <div class="card bg-secondary-subtle text-dark mb-4 shadow">
      <div class="card-body">
        <div class="row g-3 align-items-center">

          <div class="col-auto">
            <button id="btn-play" class="btn btn-success btn-lg" title="Play">
              &#9654; Play
            </button>
          </div>

          <div class="col-auto">
            <button id="btn-stop" class="btn btn-secondary btn-lg" title="Stop">
              &#9632; Stop
            </button>
          </div>

          <div class="col-auto">
            <button id="btn-record" class="btn btn-outline-danger btn-lg" title="Record">
              &#9679; Record
            </button>
          </div>

          <div class="col-auto">
            <button id="btn-clear" class="btn btn-outline-dark" title="Clear pattern">
              Clear Pattern
            </button>
          </div>

          <div class="col-auto ms-auto">
            <label for="bpm-input" class="form-label mb-0 me-2 fw-semibold">BPM</label>
            <input
              type="number"
              id="bpm-input"
              class="form-control d-inline-block"
              style="width: 90px;"
              min="40"
              max="300"
              value="120"
            >
          </div>

        </div>
      </div>
    </div>

    <div class="row g-4">

      <!-- Drum Pads -->
      <div class="col-12 col-lg-5">
        <h2 class="h5 mb-3">Pads</h2>
        <div id="pad-grid" class="pad-grid">
          <!-- Pads injected by JS -->
        </div>
      </div>

      <!-- Step Sequencer -->
      <div class="col-12 col-lg-7">
        <h2 class="h5 mb-3">Sequencer</h2>
        <div class="sequencer-wrapper">
          <div id="sequencer-grid" class="sequencer-grid">
            <!-- Rows injected by JS -->
          </div>
        </div>
      </div>

    </div>

    <footer class="text-center text-secondary mt-5 small">
      Pattern, BPM and pad mapping are auto-saved to your browser's local storage.
    </footer>

  </div>

  <!-- Bootstrap JS Bundle via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
